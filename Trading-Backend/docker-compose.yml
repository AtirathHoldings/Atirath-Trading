services:
  # 1. PostgreSQL Database
  postgres-db:
    image: postgres:16-alpine
    container_name: atirath-postgres
    restart: always
    environment:
      POSTGRES_DB: atirath_trading_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/data-postgres.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - atirath-network

  # 2. Redis Cache & Streams
  redis-cache:
    image: redis:7-alpine
    container_name: atirath-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - atirath-network

  # 3. Spring Boot Backend Service
  trading-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atirath-trading-backend
    restart: always
    depends_on:
      - postgres-db
      - redis-cache
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres-db:5432/atirath_trading_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - atirath-network

networks:
  atirath-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
